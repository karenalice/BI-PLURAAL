<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Power BI Portal</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <script
        src="./main.js"
        defer
    ></script>
</head>

<body>

    <header class="topbar">
        <div class="topbar-content">

            <div class="brand">
                <img
                    src="./logo.png"
                    alt="Logo Power BI Portal"
                    class="brand-logo"
                >

                <span class="brand-title">
                    Power BI Portal
                </span>
            </div>

        </div>
    </header>


    <section class="hero">

        <div class="hero-content">

            <img
                src="./logo.png"
                alt="Logo Portal"
                class="hero-logo"
            >

            <h1>
                Portal de Dashboards
            </h1>

            <p>
                Acesso centralizado a todos os dashboards do Power BI.
                Pesquise pelo nome e clique no ícone para abrir o dashboard.
            </p>

        </div>

    </section>


    <main class="container">

        <section class="dashboards-section">

            <div class="section-header">

                <div>

                    <h2>
                        Dashboards Disponíveis
                    </h2>

                    <span
                        class="subtitle"
                        id="quantidadeDashboards"
                    >
                        Carregando dashboards...
                    </span>

                </div>

            </div>


            <div class="search-area">

                <div class="search-box">

                    <span
                        class="search-icon"
                        aria-hidden="true"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >
                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                                stroke="currentColor"
                                stroke-width="2"
                            />

                            <path
                                d="M20 20L16.5 16.5"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                    </span>

                    <input
                        type="text"
                        id="campoPesquisa"
                        placeholder="Pesquisar dashboard..."
                        autocomplete="off"
                        aria-label="Pesquisar dashboard"
                    >

                </div>

            </div>


            <div
                class="cards-grid"
                id="listaDashboards"
            >
            </div>


            <div
                id="nenhumResultado"
                class="nenhum-resultado"
                style="display:none;"
            >

                <div class="nenhum-resultado-icone">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <path
                            d="M20 20L16.5 16.5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                </div>

                <p>
                    Nenhum dashboard encontrado.
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            Power BI Portal
        </p>

    </footer>

</body>
</html>
