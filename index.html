<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Power BI Portal</title>

    <link rel="stylesheet" href="style.css">

    <!-- JavaScript externo -->
    <script src="main.js" defer></script>
</head>

<body>

    <!-- =========================================================
         TOPO
         ========================================================= -->
    <header class="topbar">
        <div class="topbar-content">

            <div class="brand">

                <img
                    src="logo.png"
                    alt="Logo Power BI Portal"
                    class="brand-logo"
                >

                <span class="brand-title">
                    Power BI Portal
                </span>

            </div>

        </div>
    </header>


    <!-- =========================================================
         HERO
         ========================================================= -->
    <section class="hero">

        <div class="hero-content">

            <img
                src="logo.png"
                alt="Logo Portal"
                class="hero-logo"
            >

            <h1>
                Portal de Dashboards
            </h1>

            <p>
                Acesso centralizado a todos os seus dashboards do Power BI.
                Clique em qualquer dashboard para visualizar os dados.
            </p>

        </div>

    </section>


    <!-- =========================================================
         DASHBOARDS
         ========================================================= -->
    <main class="container">

        <section class="dashboards-section">

            <h2>
                Dashboards Disponíveis
            </h2>

            <span
                class="subtitle"
                id="quantidadeDashboards"
            >
                Carregando dashboards...
            </span>


            <!-- PESQUISA -->
            <div class="search-area">

                <input
                    type="text"
                    id="campoPesquisa"
                    placeholder="Pesquisar dashboard..."
                    autocomplete="off"
                >

            </div>


            <!--
                OS CARDS SERÃO CRIADOS PELO main.js
            -->
            <div
                class="cards-grid"
                id="listaDashboards"
            >
            </div>


            <!-- MENSAGEM QUANDO NÃO ENCONTRAR -->
            <div
                id="nenhumResultado"
                style="
                    display:none;
                    text-align:center;
                    padding:30px;
                    color:#777;
                "
            >
                Nenhum dashboard encontrado.
            </div>

        </section>

    </main>

</body>
</html>
